<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Create Account | HireFlow</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body"><a class="logo auth-logo" href="index.html">Hire<span>Flow</span></a>
    <main class="auth-card"><span class="eyebrow">Get started</span>
        <h1>Create your account</h1>
        <p>Build your profile and start discovering opportunities.</p>
        <form><label>Full name<input type="text" placeholder="Your name" required></label><label>Email address<input
                    type="email" placeholder="you@example.com" required></label><label>Password<input type="password"
                    placeholder="Create a password" required></label><label>Account type<select>
                    <option>Job Seeker</option>
                    <option>Employer</option>
                </select></label><button class="btn full">Create Account</button></form>
        <p class="auth-bottom">Already have an account? <a href="login.html">Log in</a></p>
    </main>
</body>

</html>
